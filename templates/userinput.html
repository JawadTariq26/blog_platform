<!-- Add this inside userinput.html above form -->
<div id="loading-spinner" class="text-center mt-4" style="display:none;">
    <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 fw-bold text-primary">AI is generating your blog...</p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const spinner = document.getElementById("loading-spinner");

        form.addEventListener("submit", function () {
            spinner.style.display = "block";
        });
    });
</script>

<div class="container">
    {{render_form(form, button_map={'submit': 'warning'})}}
</div>
